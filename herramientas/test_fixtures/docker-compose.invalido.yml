version: '3.8'

# ESCENARIO INVÁLIDO DE PRUEBA: VIOLACIÓN ARQUITECTÓNICA
# Dos servicios ('pedidos-service' y 'pagos-service') comparten la misma base de datos 'monolito_db'
# La Fitness Function DEBE detectar esta violación y abortar con código 1.

services:
  pedidos-service:
    image: python:3.11-slim
    environment:
      - DATABASE_URL=postgresql://usr:pass@shared-db:5432/monolito_db

  pagos-service:
    image: python:3.11-slim
    environment:
      - DATABASE_URL=postgresql://usr:pass@shared-db:5432/monolito_db

  shared-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=monolito_db
